# Production stack for a single host that already runs nginx on 80/443 and a shared
# `mynet` Docker network with a Redis container reachable as `redis`.
#
# Containers publish to 127.0.0.1 only; the host nginx vhost terminates TLS and
# proxies to the dashboard container, which in turn proxies /api/ to the API.
# The SMTP ingress is the exception — it binds 587/465 publicly, as it must.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# MongoDB is external (Atlas). Redis is external (already on mynet).
#
# Blue/green: api, dashboard, smtp-ingress and worker each have a "-blue"/"-green"
# pair below instead of a single service. Only one of each pair is normally
# running - deploy/deploy.sh builds and starts whichever slot is idle, health-checks
# it, then cuts traffic over before stopping the other slot. See that file for how
# each service's cutover actually works - api and worker move a `mynet` network
# alias (dashboard's own nginx resolves "smtpsaas-api" dynamically per request, see
# deploy/dashboard-nginx.conf, so this needs no config reload); dashboard moves the
# host nginx vhost's upstream port via an included snippet (same pattern as
# ajaykrp.me); smtp-ingress is the one exception that cannot be a true overlapping
# cutover, because only one container can ever hold host ports 587/465 - deploy.sh
# validates the new image in an unpublished throwaway container first, then does a
# brief stop-old/start-new swap. Never run `docker compose -f docker-compose.prod.yml
# up -d` bare here - always target one service explicitly, or every slot of every
# pair comes up at once (and smtp-ingress-blue/-green will collide on 587/465 if
# both happen to be running together).

networks:
  default:
    name: mynet
    external: true

# The Docker daemon on this host has no default log rotation and the disk runs
# ~85% full, so every service caps its own json-file logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-api: &api
  build: { context: ., dockerfile: Dockerfile, args: { APP: api } }
  restart: unless-stopped
  env_file: [.env.production]
  logging: *logging
  stop_grace_period: 15s
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

x-dashboard: &dashboard
  build: { context: ., dockerfile: apps/dashboard/Dockerfile }
  restart: unless-stopped
  logging: *logging
  volumes:
    - ./deploy/dashboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro

x-smtp-ingress: &smtp-ingress
  build: { context: ., dockerfile: Dockerfile, args: { APP: smtp-ingress } }
  restart: unless-stopped
  env_file: [.env.production]
  environment:
    SMTP_SUBMISSION_PORT: 587
    SMTP_TLS_PORT: 465
    # Synced out of /etc/letsencrypt by deploy/sync-certs.sh so uid 1000 can read them.
    SMTP_TLS_CERT_PATH: /certs/fullchain.pem
    SMTP_TLS_KEY_PATH: /certs/privkey.pem
  volumes:
    - ./certs:/certs:ro
  logging: *logging
  stop_grace_period: 15s

x-worker: &worker
  build: { context: ., dockerfile: Dockerfile, args: { APP: worker } }
  restart: unless-stopped
  env_file: [.env.production]
  stop_grace_period: 15s
  logging: *logging
  depends_on: [maildev]

services:
  api-blue:
    <<: *api
    container_name: smtpsaas_api_blue
    ports: ['127.0.0.1:4010:4000']

  api-green:
    <<: *api
    container_name: smtpsaas_api_green
    ports: ['127.0.0.1:4011:4000']

  dashboard-blue:
    <<: *dashboard
    container_name: smtpsaas_dashboard_blue
    ports: ['127.0.0.1:5175:80']

  dashboard-green:
    <<: *dashboard
    container_name: smtpsaas_dashboard_green
    ports: ['127.0.0.1:5176:80']

  smtp-ingress-blue:
    <<: *smtp-ingress
    container_name: smtpsaas_ingress_blue
    ports: ['587:587', '465:465']

  smtp-ingress-green:
    <<: *smtp-ingress
    container_name: smtpsaas_ingress_green
    ports: ['587:587', '465:465']

  worker-blue:
    <<: *worker
    container_name: smtpsaas_worker_blue

  worker-green:
    <<: *worker
    container_name: smtpsaas_worker_green

  # Stands in for recipient MX servers: this host's outbound port 25 is blocked by the
  # provider, so the worker delivers here instead (DELIVERY_MX_OVERRIDE=maildev:1025).
  maildev:
    container_name: smtpsaas-maildev
    image: maildev/maildev:2.1.0
    restart: unless-stopped
    environment:
      MAILDEV_WEB_PORT: 1080
    # The image's own healthcheck hits `localhost`, which resolves to [::1] here while
    # MailDev binds IPv4 only — it reports unhealthy while working fine. Pin to 127.0.0.1.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:1080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    ports: ['127.0.0.1:1080:1080']
    logging: *logging
