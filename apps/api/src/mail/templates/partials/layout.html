<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f4f5;">
    <!-- Preview text shown next to the subject in inbox lists. -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5; padding:32px 12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#18181b;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;">
            <tr>
              <td style="padding:0 4px 18px;">
                <a href="{{appUrl}}" style="text-decoration:none; color:#18181b; font-size:16px; font-weight:700;">
                  <span style="display:inline-block; width:26px; height:26px; line-height:26px; text-align:center; border-radius:7px; background:#4f46e5; color:#ffffff; font-size:14px; margin-right:8px;">&#9993;</span>{{brand}}
                </a>
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff; border:1px solid #e7e7ea; border-radius:14px; padding:32px 32px 28px;">
                {{{content}}}
              </td>
            </tr>
            <tr>
              <td style="padding:22px 12px 0; text-align:center; font-size:12px; line-height:1.7; color:#a1a1aa;">
                You're receiving this email because of your {{brand}} account.<br />
                Questions? Email <a href="mailto:{{supportEmail}}" style="color:#71717a;">{{supportEmail}}</a><br />
                <a href="{{appUrl}}/terms" style="color:#71717a;">Terms</a> &middot;
                <a href="{{appUrl}}/privacy" style="color:#71717a;">Privacy</a> &middot;
                &copy; {{year}} {{brand}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
