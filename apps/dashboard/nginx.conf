server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Declare the charset in the Content-Type header, not only in the document's <meta>:
  # the header wins over the tag, and an audit tool or a client that trusts it reads
  # nothing else. nginx only appends the charset for types in charset_types, so
  # text/markdown (the Markdown mirror) and text/css are added to the default list.
  charset utf-8;
  charset_types text/css text/plain text/markdown text/xml application/javascript application/rss+xml;

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The build also writes a Markdown mirror of every public page plus llms.txt, for
  # assistants and crawlers that do not run JavaScript. Without an explicit type nginx
  # serves .md as application/octet-stream, which browsers download instead of showing.
  location ~ \.md$ {
    default_type text/markdown;
    try_files $uri =404;
  }

  # Proxy API calls (adjust `api` to your API service hostname).
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
