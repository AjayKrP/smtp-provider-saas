server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The build also writes a Markdown mirror of every public page plus llms.txt, for
  # assistants and crawlers that do not run JavaScript. Without an explicit type nginx
  # serves .md as application/octet-stream, which browsers download instead of showing.
  location ~ \.md$ {
    default_type text/markdown;
    charset utf-8;
    try_files $uri =404;
  }

  # Proxy API calls (adjust `api` to your API service hostname).
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
