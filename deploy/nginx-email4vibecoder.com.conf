# Host nginx vhost for the Email4VibeCoder site, dashboard and API.
# Installed at /etc/nginx/sites-enabled/email4vibecoder.com.conf.
# Certbot rewrites this file to add the TLS server blocks and the :80 redirects,
# so this copy stays as the pre-TLS reference (see deploy.sh's nginx-site-ref check).
#
# Everything is served by the `smtpsaas-dashboard` container, which serves the SPA
# and proxies /api/ on to the API container. `deploy.sh` swaps the blue/green port
# inside /etc/nginx/snippets/smtpsaas_active_dashboard.conf, so never hardcode it.
#
# The mail hostname (smtp.email4vibecoder.com) is NOT served here: it must resolve
# straight to the server for SMTP, so its A record stays DNS-only in Cloudflare and
# nginx never terminates it.

server {
    listen 80;
    listen [::]:80;
    server_name email4vibecoder.com;

    client_max_body_size 2m;

    access_log /var/log/nginx/email4vibecoder.com.access.log;
    error_log  /var/log/nginx/email4vibecoder.com.error.log;

    location / {
        include /etc/nginx/snippets/smtpsaas_active_dashboard.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# One canonical host: www and the retired smtp.ajaykrp.me both redirect to the apex,
# so old links, bookmarks and shared URLs keep working.
server {
    listen 80;
    listen [::]:80;
    server_name www.email4vibecoder.com smtp.ajaykrp.me;

    access_log off;

    return 301 https://email4vibecoder.com$request_uri;
}
