# Host nginx vhost for the SMTP SaaS dashboard + API.
# Installed at /etc/nginx/sites-enabled/smtp.ajaykrp.me.conf.
# Certbot rewrites this file to add the TLS server block and the :80 redirect.
#
# Everything is served by the `smtpsaas-dashboard` container on 127.0.0.1:5175,
# which serves the SPA and proxies /api/ on to the API container.

server {
    listen 80;
    listen [::]:80;
    server_name smtp.ajaykrp.me;

    client_max_body_size 2m;

    access_log /var/log/nginx/smtp.ajaykrp.me.access.log;
    error_log  /var/log/nginx/smtp.ajaykrp.me.error.log;

    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
