# Mounted over the image's default.conf by docker-compose.prod.yml.
# Differs from apps/dashboard/nginx.conf in that it targets the uniquely named
# `smtpsaas-api` container — service names are shared with every other stack on `mynet`.

# Security headers for the SPA, set once at server level. nginx drops server-level
# add_header in any location that has its own add_header, so no location below may
# use add_header; per-path values come from these maps instead. An empty value means
# "don't send": /api/ responses already carry helmet's headers from the API. Match on
# $request_uri, not $uri: the /api/ location rewrites $uri to strip the prefix.
#
# The CSP allows Razorpay Checkout (checkout.js + its risk script from cdn.razorpay.com,
# the api.razorpay.com iframe, XHR to *.razorpay.com) and Google Fonts. Verified in
# Chrome against a live Checkout session with zero violations; if payments ever break,
# look for "Refused to" CSP errors in the browser console first.
map $request_uri $spa_csp {
  ~^/api/  "";
  default  "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
}
map $request_uri $spa_hsts {
  ~^/api/  "";
  default  "max-age=31536000; includeSubDomains";
}
map $request_uri $spa_frame_options {
  ~^/api/  "";
  default  "DENY";
}
map $request_uri $spa_nosniff {
  ~^/api/  "";
  default  "nosniff";
}
map $request_uri $spa_referrer {
  ~^/api/  "";
  default  "strict-origin-when-cross-origin";
}
map $request_uri $spa_permissions {
  ~^/api/  "";
  default  "camera=(), microphone=(), geolocation=(), usb=()";
}
# Hashed build assets are immutable; index.html must never be cached.
map $uri $spa_cache_control {
  ~^/assets/    "public, max-age=31536000, immutable";
  /index.html   "no-store";
  default       "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log;

  # Docker's embedded DNS - resolves "smtpsaas-api" per request instead of once at
  # nginx startup, so deploy.sh can move that alias between the api-blue/api-green
  # containers without ever needing to reload this nginx.
  resolver 127.0.0.11 valid=10s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Content-Security-Policy $spa_csp always;
  add_header Strict-Transport-Security $spa_hsts always;
  add_header X-Frame-Options $spa_frame_options always;
  add_header X-Content-Type-Options $spa_nosniff always;
  add_header Referrer-Policy $spa_referrer always;
  add_header Permissions-Policy $spa_permissions always;
  add_header Cache-Control $spa_cache_control;
  server_tokens off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # With a variable proxy_pass (needed for the resolver above to matter),
    # nginx does NOT strip the location prefix the way it does for a literal
    # proxy_pass target - the original URI is passed through unchanged. The
    # api app itself mounts routes at root ("/health", not "/api/health"),
    # so without this rewrite every request 404s inside the app. Confirmed
    # live: /api/health came back as the app's own "Route not found" JSON,
    # not an nginx 404, meaning it reached the app with the wrong path.
    #
    # `set` MUST come before `rewrite ... break` - break stops all further
    # rewrite-module directives (set included) in this location for the
    # request, so a `set` placed after it never runs and $upstream_api is
    # left uninitialized. Confirmed live: nginx logged "using uninitialized
    # upstream_api variable" and every request 500'd.
    set $upstream_api http://smtpsaas-api:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API scopes the refresh cookie to path=/auth, but the SPA reaches it at
    # /api/auth/refresh — without this rewrite the browser never sends the cookie
    # back and every session dies on reload.
    proxy_cookie_path /auth /api/auth;
    # Razorpay signs the raw webhook body — never let nginx buffer-transform it.
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }
}
